name: Generate lmfit PDF example
on:
  push:
    branches: [main]
    paths:
      - 'working-from-phone/linear_fit.py'
      - 'working-from-phone/requirements.txt'
      - '.github/workflows/working-from-phone-plot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-plot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: working-from-phone/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r working-from-phone/requirements.txt
      - name: Generate fit and PDF
        run: python working-from-phone/linear_fit.py
      - name: Verify PDF
        run: test -s working-from-phone/linear_fit.pdf
      - name: Commit generated PDF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working-from-phone/linear_fit.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Generate lmfit linear fit PDF"
            git push
          fi
